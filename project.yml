name: Kehai
options:
  bundleIdPrefix: com.hinodeentertainment
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kehai:
    type: application
    platform: iOS
    sources: [Kehai, Shared]
    dependencies:
      - target: KehaiWidget
    info:
      path: Kehai/Info.plist
      properties:
        CFBundleDisplayName: Kehai
        UILaunchScreen: {}
        # 暗号化は HTTPS 通信のみ。TestFlight で毎回輸出コンプライアンスを聞かれないようにする。
        ITSAppUsesNonEncryptionExemption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinodeentertainment.kehai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  KehaiWidget:
    type: app-extension
    platform: iOS
    sources: [KehaiWidget, Shared]
    info:
      path: KehaiWidget/Info.plist
      properties:
        CFBundleDisplayName: Kehai
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinodeentertainment.kehai.widget
        TARGETED_DEVICE_FAMILY: "1"
