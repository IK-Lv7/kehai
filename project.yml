name: Kehai
options:
  bundleIdPrefix: com.hinodeentertainment
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  KehaiCore:
    path: KehaiCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Kehai:
    type: application
    platform: iOS
    sources:
      - Kehai
      - Shared
      - character.json
    dependencies:
      - target: KehaiWidget
      - package: Supabase
      - package: KehaiCore
    entitlements:
      path: Kehai/Kehai.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # 配布用の署名で、自動的に production に置き換わる。
        aps-environment: development
        com.apple.security.application-groups: [group.com.hinodeentertainment.kehai]
    info:
      path: Kehai/Info.plist
      properties:
        CFBundleDisplayName: Kehai
        UILaunchScreen: {}
        # トントンの通知が届いたとき、裏でウィジェットのキャラを更新する。
        UIBackgroundModes: [remote-notification]
        # 暗号化は OS 標準の HTTPS 通信のみ。TestFlight で毎回輸出コンプライアンスを聞かれないようにする。
        ITSAppUsesNonEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinodeentertainment.kehai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  KehaiWidget:
    type: app-extension
    platform: iOS
    sources:
      - KehaiWidget
      - Shared
      - character.json
    dependencies:
      - package: Supabase
      - package: KehaiCore
    entitlements:
      path: KehaiWidget/KehaiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hinodeentertainment.kehai]
    info:
      path: KehaiWidget/Info.plist
      properties:
        CFBundleDisplayName: Kehai
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinodeentertainment.kehai.widget
        TARGETED_DEVICE_FAMILY: "1"
